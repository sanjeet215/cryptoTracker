spring:
  application:
    name: trade-consumer

  datasource:
    # reWriteBatchedInserts: Postgres driver turns a JDBC batch into one multi-row INSERT
    url: jdbc:postgresql://localhost:5432/tracker?reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}       # never in the file; injected as env var (local profile maps it from .env)

  jpa:
    open-in-view: false            # no DB connection held open for the whole web request
    hibernate:
      ddl-auto: validate           # Hibernate only checks; Flyway owns the schema
    properties:
      hibernate.jdbc.batch_size: 100   # group up to 100 INSERTs into one JDBC batch
      hibernate.order_inserts: true    # keep same-table inserts together so batching isn't broken

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true      # fail startup if an applied migration was edited (checksum mismatch)
    clean-disabled: true           # forbid "flyway clean" (drops everything); always true in prod
    baseline-on-migrate: false     # only true when adopting an existing DB that already has tables

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trade-counter
      max-poll-records: 100        # up to 100 records per listener call
      fetch-min-size: 15KB
      fetch-max-wait: 2s
      auto-offset-reset: earliest  # a new group starts from the oldest available message
      enable-auto-commit: false    # offsets committed by Spring after the listener succeeds
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.devpour.consumer.domain.TradeEvent
        spring.json.use.type.headers: false
        isolation.level: read_committed
    listener:
      concurrency: 4               # 4 consumer threads = 4 partitions

server:
  port: 8083

management:
  server:
    port: 9083
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

app:
  kafka:
    trades-topic: trades.v1
